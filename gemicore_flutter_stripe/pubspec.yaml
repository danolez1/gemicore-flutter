name: gemicore_flutter_stripe
description: "Apple Pay and Google Pay sheet for gemicore_flutter, on the Stripe payment sheet. Add it and pass GemicoreStripePaySheet to Gemicore.configure."
version: 0.1.0
repository: https://github.com/danolez1/gemicore-flutter/tree/main/gemicore_flutter_stripe
homepage: https://gemicore.com/docs/guide/in-app-purchases
issue_tracker: https://github.com/danolez1/gemicore-flutter/issues
topics:
  - stripe
  - apple-pay
  - google-pay
  - payments
  - in-app-purchase
# The owner decides when this goes to pub.dev (triage decision O-D12).
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_stripe: ^14.2.0
  gemicore_flutter:
    path: ../gemicore_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
